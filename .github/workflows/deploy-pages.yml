name: Deploy BioAlign Pro Protein Structure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_PATH: /BioAlign-Pro-Protein-Structure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static data
        run: npm run data:build --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build static export
        run: npm run build

      - name: Ensure GitHub Pages files exist
        run: |
          test -f out/index.html
          test -f out/.nojekyll || touch out/.nojekyll
          test -d out/_next
          test -d out/data
          test -d out/indexes
          ls -la out
          find out/data/protein-packs -maxdepth 1 -type f | head -30 || true
          find out/indexes -maxdepth 1 -type f || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
