name: Deploy BioAlign-Pro-Protein-Structure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify docs static site
        run: |
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/.nojekyll
          test -f docs/assets/css/site.css
          test -f docs/assets/js/app.js
          test -f docs/offline-sw.js
          test -f docs/robots.txt
          test -f docs/sitemap.xml
          test -f docs/site.webmanifest
          test -f docs/data/manifest.json
          test -f docs/data/starter-proteins.json
          git ls-files docs/data/structures | grep -q . && exit 1 || true
          find docs -name '*.ts' -o -name '*.tsx' | grep -q . && exit 1 || true
          artifact_size="$(du -sm docs | cut -f1)"
          test "$artifact_size" -lt 100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
